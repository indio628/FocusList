<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusList - Tareas & Pomodoro</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #10b981;
            --danger: #ef4444;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Cambio clave para celular */
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-top: 10px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 4px;
            text-align: center;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        /* Pomodoro Section */
        .pomodoro-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
        }

        .timer-display {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin: 8px 0;
            color: var(--primary);
        }

        .timer-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .timer-btns {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: var(--border);
            color: var(--text-color);
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        /* Todo Section */
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-color);
            font-size: 0.9rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        .task-list {
            list-style: none;
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 8px;
        }

        .task-item.active {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            cursor: pointer;
            overflow: hidden;
        }

        .task-info input[type="checkbox"] {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .task-text {
            font-size: 0.9rem;
            word-break: break-word;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px 8px;
        }

        .delete-btn:hover {
            color: var(--danger);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FocusList</h1>
        <p class="subtitle">Organiza tus tareas y enfócate con Pomodoro</p>

        <!-- Pomodoro Timer -->
        <div class="pomodoro-box">
            <div class="timer-label" id="timerLabel">Modo Concentración</div>
            <div class="timer-display" id="timerDisplay">25:00</div>
            <div class="timer-btns">
                <button class="btn-primary" id="startBtn" onclick="toggleTimer()">Iniciar</button>
                <button class="btn-secondary" onclick="resetTimer()">Reiniciar</button>
                <button class="btn-secondary" onclick="switchMode()">Cambiar Modo</button>
            </div>
        </div>

        <!-- Add Task -->
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="¿Qué tenés que hacer hoy?" onkeypress="handleKeyPress(event)">
            <button class="btn-primary" onclick="addTask()">Agregar</button>
        </div>

        <!-- Task List -->
        <ul class="task-list" id="taskList">
            <!-- Las tareas se cargan dinámicamente -->
        </ul>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('focuslist_tasks')) || [];
        
        let totalSeconds = 25 * 60;
        let timerInterval = null;
        let isRunning = false;
        let isWorkMode = true;

        const timerDisplay = document.getElementById('timerDisplay');
        const timerLabel = document.getElementById('timerLabel');
        const startBtn = document.getElementById('startBtn');
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');

        function updateTimerDisplay() {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                startBtn.textContent = 'Iniciar';
                startBtn.classList.remove('btn-secondary');
                startBtn.classList.add('btn-primary');
                isRunning = false;
            } else {
                isRunning = true;
                startBtn.textContent = 'Pausar';
                startBtn.classList.remove('btn-primary');
                startBtn.classList.add('btn-secondary');
                
                timerInterval = setInterval(() => {
                    if (totalSeconds > 0) {
                        totalSeconds--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;
                        alert(isWorkMode ? '¡Tiempo cumplido! Tomate 5 minutos de descanso.' : '¡Descanso terminado! A volver al enfoque.');
                        resetTimer();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.textContent = 'Iniciar';
            startBtn.classList.remove('btn-secondary');
            startBtn.classList.add('btn-primary');
            totalSeconds = isWorkMode ? 25 * 60 : 5 * 60;
            updateTimerDisplay();
        }

        function switchMode() {
            isWorkMode = !isWorkMode;
            timerLabel.textContent = isWorkMode ? 'Modo Concentración' : 'Modo Descanso';
            resetTimer();
        }

        function saveTasks() {
            localStorage.setItem('focuslist_tasks', JSON.stringify(tasks));
        }

        function renderTasks() {
            taskList.innerHTML = '';
            
            if (tasks.length === 0) {
                taskList.innerHTML = '<div class="empty-state">No hay tareas pendientes. ¡Agregá una!</div>';
                return;
            }

            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = `task-item ${task.completed ? 'completed' : ''}`;
                
                li.innerHTML = `
                    <div class="task-info" onclick="toggleTask(${index})">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask(${index})">
                        <span class="task-text">${escapeHtml(task.text)}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${index})">&times;</button>
                `;
                taskList.appendChild(li);
            });
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (text === '') return;

            tasks.push({ text: text, completed: false });
            taskInput.value = '';
            saveTasks();
            renderTasks();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                addTask();
            }
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        updateTimerDisplay();
        renderTasks();
    </script>
</body>
</html>
